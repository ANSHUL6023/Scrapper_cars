<!--
  EV CHARGING STATION FINDER — fyndmycar.com (State + City + Strict EV-only filtering, New Places API)
  =========================================================================================================
  SETUP:
  1. In Google Cloud Console > APIs & Services > Library, make sure "Places API (New)" is ENABLED
     (in addition to "Maps JavaScript API" and the older "Places API" you may already have).
  2. Replace YOUR_GOOGLE_MAPS_API_KEY below with your real key.
  3. Paste this entire file into an Elementor HTML widget and publish.

  WHY THIS VERSION CHANGED:
  - The legacy nearbySearch "type" parameter does NOT reliably filter to EV charging stations only —
    Google silently ignores it for this type and returns generic nearby places (hotels, banks, schools, etc).
  - This version uses Google's new Places API (searchNearby with includedTypes), which properly and
    strictly returns ONLY electric_vehicle_charging_station results — nothing else gets shown or pinned.
  - State dropdown cascades into a City dropdown (major cities per state). Picking a city zooms/searches
    that specific area; "All / Whole State" searches the state-wide center.
-->

<div id="evf-root" style="max-width:1100px;margin:0 auto;font-family:Manrope,Helvetica,sans-serif;">

    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;">
      <select id="evf-state" style="padding:10px 14px;border:1px solid #ccc;border-radius:8px;font-size:15px;min-width:230px;">
        <option value="">📍 Near Me (auto-detected)</option>
      </select>
      <select id="evf-city" style="padding:10px 14px;border:1px solid #ccc;border-radius:8px;font-size:15px;min-width:200px;display:none;">
        <option value="">All / Whole State</option>
      </select>
      <button id="evf-gps-btn" style="padding:10px 16px;border:none;border-radius:8px;background:#ED1B24;color:#fff;font-size:14px;cursor:pointer;">
        Use My Exact Location
      </button>
      <span id="evf-status" style="font-size:14px;color:#555;"></span>
    </div>
  
    <div id="evf-map" style="width:100%;height:420px;border-radius:10px;margin-bottom:18px;background:#eee;"></div>
  
    <div id="evf-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;"></div>
  
  </div>

    const EV_TYPE = 'electric_vehicle_charging_station';
  
    let map, markers = [];
    let statusEl, listEl, stateSelect, citySelect;
  
    function setStatus(msg){ statusEl.textContent = msg; }
  
    function clearMarkers(){
      markers.forEach(m => m.setMap(null));
      markers = [];
    }
  
    function kmDistance(lat1, lng1, lat2, lng2){
      const R = 6371;
      const dLat = (lat2-lat1) * Math.PI/180;
      const dLng = (lng2-lng1) * Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }
  
    function renderStations(places, originLat, originLng){
      listEl.innerHTML = '';
      clearMarkers();
  
      if (!places.length){
        listEl.innerHTML = '<p style="color:#777;">No EV charging stations found in this area yet.</p>';
        return;
      }
  
      places.forEach(place => {
        const lat = place.location.latitude;
        const lng = place.location.longitude;
        const dist = kmDistance(originLat, originLng, lat, lng);
        const name = place.displayName ? place.displayName.text : 'EV Charging Station';
        const address = place.formattedAddress || '';
        const rating = place.rating ? `⭐ ${place.rating} (${place.userRatingCount || 0} reviews)` : 'No ratings yet';
        const status = place.businessStatus === 'OPERATIONAL' ? 'Operational' : (place.businessStatus || 'Unknown status');
  
        const types = place.types || [];
        const isFuelStationCombo = types.includes('gas_station');
        const label = isFuelStationCombo ? '⛽⚡ Fuel station with EV charging' : '⚡ EV Charging Station';
        const markerIcon = isFuelStationCombo
          ? 'https://maps.google.com/mapfiles/ms/icons/orange-dot.png'
          : 'https://maps.google.com/mapfiles/ms/icons/green-dot.png';
  
        // Opens turn-by-turn directions in Google Maps (app on mobile, web on desktop),
        // using the user's current device location as the starting point automatically.
        const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&destination_place_id=&travelmode=driving`;
  
        const card = document.createElement('div');
        card.style = 'border:1px solid #e0e0e0;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);';
        card.innerHTML = `
          <div style="font-weight:600;font-size:15px;margin-bottom:4px;">${name}</div>
          <div style="font-size:11px;font-weight:600;color:${isFuelStationCombo ? '#b35c00' : '#1a8a3d'};text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;">${label}</div>
          <div style="font-size:13px;color:#555;margin-bottom:6px;">${address}</div>
          <div style="font-size:13px;color:#ED1B24;font-weight:600;margin-bottom:4px;">${dist} km away</div>
          <div style="font-size:13px;color:#444;margin-bottom:2px;">${rating}</div>
          <div style="font-size:13px;color:#777;margin-bottom:10px;">${status}</div>
          <a href="${directionsUrl}" target="_blank" rel="noopener" style="display:inline-block;padding:8px 14px;background:#ED1B24;color:#fff;border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;"> Navigate to this station</a>
        `;
        listEl.appendChild(card);
  
        const marker = new google.maps.Marker({
          position: {lat, lng},
          map,
          title: name,
          icon: {
            url: markerIcon
          }
        });
  
        const infoWindow = new google.maps.InfoWindow({
          content: `<div style="font-size:13px;max-width:220px;"><b>${name}</b><br><span style="color:${isFuelStationCombo ? '#b35c00' : '#1a8a3d'};">${label}</span><br>${address}<br>${dist} km away<br><a href="${directionsUrl}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;padding:5px 10px;background:#ED1B24;color:#fff;border-radius:5px;text-decoration:none;font-size:12px;font-weight:600;">📍 Navigate</a></div>`
        });
        marker.addListener('click', () => infoWindow.open(map, marker));
  
        markers.push(marker);
      });
    }
  
    function searchNearby(lat, lng, rankPreference){
      return fetch('https://places.googleapis.com/v1/places:searchNearby', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.userRatingCount,places.businessStatus,places.types'
        },
        body: JSON.stringify({
          includedTypes: [EV_TYPE],
          maxResultCount: 20, // 20 is Google's hard per-call max — we merge two calls below to reach up to 40
          rankPreference: rankPreference,
          locationRestriction: {
            circle: {
              center: { latitude: lat, longitude: lng },
              radius: 50000.0
            }
          }
        })
      }).then(res => res.json()).then(data => data.places || []).catch(() => []);
    }
  
    function fetchStations(lat, lng){
      setStatus('Searching for EV charging stations...');
  
      // New Places API (searchNearby) — properly supports filtering to ONLY
      // electric_vehicle_charging_station results, unlike the legacy nearbySearch
      // type parameter which Google silently ignores for this type.
      //
      // Each call is capped at 20 results by Google. To get up to 40, we run two
      // searches (distance-ranked + popularity-ranked) and merge unique stations
      // by place id — this also surfaces a better mix of dedicated EV networks
      // alongside fuel-station combo chargers, rather than one ranking dominating.
      Promise.all([
        searchNearby(lat, lng, 'DISTANCE'),
        searchNearby(lat, lng, 'POPULARITY')
      ]).then(([byDistance, byPopularity]) => {
        const merged = {};
        [...byDistance, ...byPopularity].forEach(p => {
          if (p.id) merged[p.id] = p;
        });
        let places = Object.values(merged);
  
        // Sort by distance from search origin, cap at 40
        places.forEach(p => { p._dist = parseFloat(kmDistance(lat, lng, p.location.latitude, p.location.longitude)); });
        places.sort((a, b) => a._dist - b._dist);
        places = places.slice(0, 40);
  
        renderStations(places, lat, lng);
        setStatus(places.length ? `Found ${places.length} EV charging station(s) within 50 km` : 'No EV charging stations found within 50 km of this location.');
      });
    }
  
    function goToLocation(lat, lng, zoom){
      if (!map){
        map = new google.maps.Map(document.getElementById('evf-map'), {
          center: {lat, lng}, zoom: zoom || 11
        });
      } else {
        map.setCenter({lat, lng});
        map.setZoom(zoom || 11);
      }
      fetchStations(lat, lng);
    }
  
    function useIpLocation(){
      setStatus('Detecting your location...');
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          if (data.latitude && data.longitude){
            goToLocation(data.latitude, data.longitude, 12);
          } else {
            goToLocation(28.6139, 77.2090, 11);
          }
        })
        .catch(() => goToLocation(28.6139, 77.2090, 11));
    }
  
    function useGpsLocation(){
      if (!navigator.geolocation){
        setStatus('GPS not supported on this browser.');
        return;
      }
      setStatus('Requesting your exact location...');
      navigator.geolocation.getCurrentPosition(
        pos => goToLocation(pos.coords.latitude, pos.coords.longitude, 13),
        () => setStatus('Location permission denied. Showing IP-based location instead.')
      );
    }
  
    function populateCities(stateName){
      citySelect.innerHTML = '<option value="">All / Whole State</option>';
      const stateData = STATES[stateName];
      if (!stateData){
        citySelect.style.display = 'none';
        return;
      }
      Object.keys(stateData.cities).forEach(cityName => {
        const coords = stateData.cities[cityName];
        const opt = document.createElement('option');
        opt.value = JSON.stringify({lat:coords[0], lng:coords[1]});
        opt.textContent = cityName;
        citySelect.appendChild(opt);
      });
      citySelect.style.display = 'inline-block';
    }
  
    function initWidget(){
      statusEl = document.getElementById('evf-status');
      listEl = document.getElementById('evf-list');
      stateSelect = document.getElementById('evf-state');
      citySelect = document.getElementById('evf-city');
  
      Object.keys(STATES).forEach(stateName => {
        const opt = document.createElement('option');
        const c = STATES[stateName].center;
        opt.value = JSON.stringify({lat:c[0], lng:c[1]});
        opt.dataset.state = stateName;
        opt.textContent = stateName;
        stateSelect.appendChild(opt);
      });
  
      document.getElementById('evf-gps-btn').addEventListener('click', useGpsLocation);
  
      stateSelect.addEventListener('change', function(){
        const selectedOption = this.options[this.selectedIndex];
        if (!this.value){
          citySelect.style.display = 'none';
          useIpLocation();
        } else {
          const coords = JSON.parse(this.value);
          const stateName = selectedOption.dataset.state;
          populateCities(stateName);
          goToLocation(coords.lat, coords.lng, 9); 
        }
      });
  
      citySelect.addEventListener('change', function(){
        if (!this.value){
          // "All / Whole State" selected — go back to state center
          const stateOpt = stateSelect.options[stateSelect.selectedIndex];
          if (stateOpt && stateOpt.value){
            const coords = JSON.parse(stateOpt.value);
            goToLocation(coords.lat, coords.lng, 9);
          }
        } else {
          const coords = JSON.parse(this.value);
          goToLocation(coords.lat, coords.lng, 12); // tighter zoom for city view
        }
      });
  
      useIpLocation();
    }
  
    (function loadGoogleMaps(){
      if (window.google && window.google.maps){ initWidget(); return; }
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&loading=async&callback=__evfInit`;
      window.__evfInit = initWidget;
      document.head.appendChild(script);
    })();
  </script>
